<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block titre %}Veille élu·es et IA{% endblock %}</title>
<style>
  :root { --fond:#f6f5f2; --carte:#fff; --texte:#1f2328; --doux:#5f6670;
          --bord:#dcdad5; --accent:#1f4e79; --erreur:#b42318; --ok:#1a7f37; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fond); color:var(--texte);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .page { max-width:640px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .hint { color:var(--doux); font-size:.9rem; }
  .carte { background:var(--carte); border:1px solid var(--bord);
           border-radius:10px; padding:18px; margin:16px 0; }
  label { display:block; font-weight:600; margin-bottom:4px; }
  input[type=file], input[type=password] { font:inherit; width:100%;
           padding:8px; border:1px solid var(--bord); border-radius:6px;
           background:#fff; }
  .champ { margin-bottom:18px; }
  button { font:inherit; cursor:pointer; padding:9px 18px; border-radius:7px;
           border:1px solid var(--accent); background:var(--accent); color:#fff; }
  .message { border-radius:8px; padding:10px 14px; margin-bottom:12px;
             border:1px solid var(--bord); background:#fff; }
  .message.error { border-color:#f1b8b2; background:#fdf0ef; color:var(--erreur); }
  .message.success { border-color:#b7e0c0; background:#f0fbf3; color:var(--ok); }
  a { color:var(--accent); }
  footer { margin-top:28px; font-size:.85rem; color:var(--doux); }
</style>
</head>
<body>
<div class="page">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for categorie, texte in messages %}
      <p class="message {{ categorie }}">{{ texte }}</p>
    {% endfor %}
  {% endwith %}
  {% block contenu %}{% endblock %}
</div>
</body>
</html>
